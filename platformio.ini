[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Interface USB : audio + MIDI + série (nécessaire pour que le Teensy
; soit reconnu comme périphérique audio/MIDI sur Ubuntu)
build_flags =
    -D USB_MIDI_AUDIO_SERIAL
    -Wall

; Optimisation : -O2 est un bon compromis pour le DSP audio
build_unflags = -Os

; Vitesse CPU (600 MHz = défaut Teensy 4.1)
board_build.f_cpu = 600000000L

; Upload via le Teensy Loader
upload_protocol = teensy-cli

; Moniteur série
monitor_speed = 115200

lib_deps =
    paulstoffregen/Encoder
    marcoschwartz/LiquidCrystal_I2C